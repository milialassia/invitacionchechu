<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Level Up CHECHU</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Orbitron', sans-serif;
letter-spacing:1px;
line-height:1.6;
color:white;
text-align:center;
overflow-x:hidden;
background:black;
}

/* TITULOS GAMER */
h1,h2,.startBtn{
font-family:'Press Start 2P', cursive;
}

/* GRID */

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
linear-gradient(#00ffe133 1px, transparent 1px),
linear-gradient(90deg,#00ffe133 1px, transparent 1px);
background-size:60px 60px;
transform:perspective(400px) rotateX(60deg);
animation:gridMove 20s linear infinite;
z-index:-1;
}

@keyframes gridMove{
from{background-position:0 0}
to{background-position:0 60px}
}

/* FLASH */

#flash{
position:fixed;
width:100%;
height:100%;
background:white;
opacity:0;
z-index:200;
transition:0.3s;
}

/* START */

#startScreen{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:100;
}

.coin{
color:#ffd54a;
animation:blink 1s infinite;
}

@keyframes blink{50%{opacity:0}}

/* BOTON */

.startBtn{
margin-top:30px;
background:#00ffe1;
padding:20px 40px;
border:none;
cursor:pointer;
border-radius:8px;
box-shadow:0 0 10px #00ffe1,0 0 40px #00ffe1;
animation:pulseBtn 1.2s infinite alternate;
}

@keyframes pulseBtn{
from{box-shadow:0 0 10px #00ffe1;}
to{box-shadow:0 0 40px #00ffe1,0 0 80px #00ffe1;}
}

/* CONTENIDO */

.container{
display:none;
padding:60px 20px;
max-width:1300px;
margin:auto;
}

.card{
background:rgba(0,0,0,0.8);
border:2px solid #00ffe1;
padding:40px;
margin:40px auto;
border-radius:14px;
}

/* BARRA */

.bar{
width:420px;
height:30px;
background:#111;
margin:30px auto;
border-radius:20px;
overflow:hidden;
border:2px solid #00ffe1;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ffe1,#00ff6a);
animation:load 6s forwards;
}

@keyframes load{to{width:100%}}

.levelup{
font-size:50px;
color:#00ff6a;
text-shadow:0 0 20px #00ff6a;
animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

/* CARRUSEL */

.carouselPro{
width:600px;
height:400px;
margin:auto;
position:relative;
overflow:hidden;
border-radius:20px;
box-shadow:0 0 40px #00ffe1;
background:black;
}

.carouselPro img{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
background:black;
opacity:0;
transition:1s;
}

.carouselPro img.active{
opacity:1;
}

/* BOTONES */

.waBtn,.gpsBtn{
display:inline-block;
margin-top:20px;
background:#00ffe1;
color:black;
padding:14px 24px;
border-radius:10px;
text-decoration:none;
box-shadow:0 0 15px #00ffe1;
}

/* PAGO */

.aliasBox{
margin:20px auto;
padding:20px;
border:2px solid #00ffe1;
border-radius:10px;
color:#00ffe1;
cursor:pointer;
text-shadow:0 0 10px #00ffe1;
animation:glow 1.5s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 10px #00ffe1;}
to{box-shadow:0 0 30px #00ffe1;}
}

.copyBtn{
margin-top:10px;
padding:10px 20px;
border:none;
background:#00ffe1;
cursor:pointer;
border-radius:8px;
}

#copiadoMsg{
opacity:0;
color:#00ff6a;
transition:0.3s;
}

@media(max-width:700px){
.carouselPro{width:90%;height:300px;}
.bar{width:90%;}
}

</style>
</head>

<body>

<div id="flash"></div>

<div id="startScreen">
<h1>🎮 CHECHU</h1>
<div class="coin">INSERT COIN</div>
<button class="startBtn" onclick="startGame()">PRESS START</button>
</div>

<div class="container" id="main">

<h1>LEVEL COMPLETE</h1>
<h2>Nivel 39 completado</h2>

<div class="bar"><div class="fill"></div></div>
<div class="levelup">LEVEL UP 40</div>

<div class="card">
<h2>🎯 MISIÓN</h2>
<p>📅 24/04/2026</p>
<p>🕒 20:45 HS</p>
<p>📍 CLUB ESCALANTITO</p>

<iframe src="https://www.google.com/maps?q=-31.6197018,-60.7007826&output=embed" width="100%" height="400"></iframe>

<a class="gpsBtn" href="https://maps.app.goo.gl/6e7FYAde83PTVfzW7" target="_blank">📍 ABRIR GPS</a>
</div>

<div class="card">
<h2>📸 NIVELES SUPERADOS</h2>
<div class="carouselPro">
<img src="foto1.jpeg" class="active">
<img src="foto2.jpeg">
<img src="foto3.jpeg">
<img src="foto4.jpeg">
</div>
</div>

<div class="card">
<h2>💰 APORTES</h2>

<div class="aliasBox" onclick="copiarAlias()">
CHECHUCUMPLE40
</div>

<button class="copyBtn" onclick="copiarAlias()">📋 Copiar alias</button>

<p id="copiadoMsg">✔ Alias copiado</p>

<a class="waBtn" href="https://wa.me/549342216819?text=Ya%20realicé%20la%20transferencia%20🎮" target="_blank">
📲 Enviar comprobante
</a>

</div>

</div>

<script>

function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("main").style.display="block";
}

function copiarAlias(){
navigator.clipboard.writeText("chechucumple40");

let msg = document.getElementById("copiadoMsg");
msg.style.opacity="1";

setTimeout(()=>{msg.style.opacity="0"},1500);
}

window.addEventListener("load",()=>{
let slides=document.querySelectorAll(".carouselPro img");
let i=0;

setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},2000);
});

</script>

</body>
</html>
