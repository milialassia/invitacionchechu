<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Level Up CHECHU</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Press Start 2P', cursive;
color:white;
text-align:center;
overflow-x:hidden;
background:black;
}

/* GRID */

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
linear-gradient(#00ffe133 1px, transparent 1px),
linear-gradient(90deg,#00ffe133 1px, transparent 1px);
background-size:60px 60px;
transform:perspective(400px) rotateX(60deg);
animation:gridMove 20s linear infinite;
z-index:-1;
}

@keyframes gridMove{
from{background-position:0 0}
to{background-position:0 60px}
}

/* START */

#startScreen{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:100;
}

.coin{
font-size:22px;
color:#ffd54a;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0}
}

.startBtn{
margin-top:30px;
background:#00ffe1;
border:none;
padding:20px 40px;
cursor:pointer;
box-shadow:0 0 25px #00ffe1;
}

/* CONTENIDO */

.container{
display:none;
padding:60px 20px;
max-width:1300px;
margin:auto;
}

.card{
background:rgba(0,0,0,0.75);
border:2px solid #00ffe1;
padding:40px;
margin:40px auto;
border-radius:14px;
transition:.4s;
}

.card:hover{
transform:scale(1.03);
box-shadow:0 0 40px #00ffe1;
}

/* BARRA */

.bar{
width:420px;
height:30px;
background:#111;
margin:30px auto;
border-radius:20px;
overflow:hidden;
border:2px solid #00ffe1;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ffe1,#00ff6a);
animation:load 6s forwards;
}

@keyframes load{
from{width:0}
to{width:100%}
}

.levelup{
font-size:60px;
color:#00ff6a;
text-shadow:0 0 30px #00ff6a;
animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1)}
to{transform:scale(1.15)}
}

/* ⭐ CARRUSEL MEJORADO */

.carouselPro{
width:600px;
height:400px;
margin:40px auto;
position:relative;
overflow:hidden;
border-radius:20px;
box-shadow:0 0 40px #00ffe1;
background:black;
}

.carouselPro img{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
object-fit:cover;
opacity:0;
transform:scale(1.05);
transition:opacity 1s ease-in-out, transform 4s ease;
}

.carouselPro img.active{
opacity:1;
transform:scale(1);
}

/* DOTS tipo Instagram */

.dots{
position:absolute;
bottom:10px;
width:100%;
text-align:center;
}

.dot{
display:inline-block;
width:8px;
height:8px;
margin:0 4px;
background:#888;
border-radius:50%;
}

.dot.active{
background:#00ffe1;
}

/* OTROS */

.countdown{
color:#ff4df0;
font-size:20px;
margin-top:20px;
}

.gpsBtn,.waBtn{
display:inline-block;
margin-top:20px;
background:#00ffe1;
color:black;
padding:16px 28px;
text-decoration:none;
border-radius:10px;
box-shadow:0 0 15px #00ffe1;
}

iframe{
box-shadow:0 0 30px #00ffe1;
border-radius:12px;
margin-top:20px;
}

/* RESPONSIVE */

@media(max-width:700px){
.carouselPro{
width:90%;
height:300px;
}
.bar{
width:90%;
}
.levelup{
font-size:40px;
}
}

</style>
</head>

<body>

<div id="startScreen">
<h1>🎮 CHECHU</h1>
<div class="coin">INSERT COIN</div>
<button class="startBtn" onclick="startGame()">PRESS START</button>
</div>

<div class="container" id="main">

<h1>LEVEL COMPLETE</h1>
<h2>Nivel 39 completado</h2>

<div class="bar"><div class="fill"></div></div>
<div class="levelup">LEVEL UP 40</div>

<div class="card">
<h2>📸 NIVELES SUPERADOS</h2>

<div class="carouselPro" id="carousel">

<img src="foto1.jpeg" class="active">
<img src="foto2.jpeg">
<img src="foto3.jpeg">
<img src="foto4.jpeg">
<img src="foto5.jpeg">
<img src="foto6.jpeg">
<img src="foto7.jpeg">
<img src="foto8.jpeg">
<img src="foto9.jpeg">
<img src="foto10.jpeg">

<div class="dots" id="dots"></div>

</div>

</div>

<div class="card">
<h2>✅ CONFIRMAR ASISTENCIA</h2>

<a class="waBtn"
href="https://wa.me/549342216819?text=Voy%20al%20Level%20Up%20de%20Chechu"
target="_blank">
CONFIRMAR POR WHATSAPP
</a>

</div>

</div>

<script>

function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("main").style.display="block";
}

/* 🎬 CARRUSEL PRO */

window.onload = function(){

const slides = document.querySelectorAll(".carouselPro img");
const dotsContainer = document.getElementById("dots");

if(slides.length === 0) return;

let index = 0;

/* crear dots */
slides.forEach((_, i)=>{
  const dot = document.createElement("span");
  dot.classList.add("dot");
  if(i === 0) dot.classList.add("active");
  dotsContainer.appendChild(dot);
});

const dots = document.querySelectorAll(".dot");

function showSlide(i){

  slides.forEach(s => s.classList.remove("active"));
  dots.forEach(d => d.classList.remove("active"));

  slides[i].classList.add("active");
  dots[i].classList.add("active");
}

setInterval(()=>{

  index = (index + 1) % slides.length;
  showSlide(index);

}, 2500); // más suave estilo IG

};

</script>

</body>
</html>
