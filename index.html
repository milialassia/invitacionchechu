<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Level Up CHECHU</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Press Start 2P', cursive;
color:white;
text-align:center;
overflow-x:hidden;
background:black;
}

/* GRID */

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
linear-gradient(#00ffe133 1px, transparent 1px),
linear-gradient(90deg,#00ffe133 1px, transparent 1px);
background-size:60px 60px;
transform:perspective(400px) rotateX(60deg);
animation:gridMove 20s linear infinite;
z-index:-1;
}

@keyframes gridMove{
from{background-position:0 0}
to{background-position:0 60px}
}

/* FLASH */

#flash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
opacity:0;
pointer-events:none;
z-index:200;
transition:opacity 0.3s;
}

/* START */

#startScreen{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:100;
transition:opacity 0.5s;
}

.coin{
font-size:22px;
color:#ffd54a;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0}
}

/* BOTON PRO */

.startBtn{
margin-top:30px;
background:#00ffe1;
border:none;
padding:20px 40px;
cursor:pointer;
font-family:'Press Start 2P', cursive;
font-size:14px;
color:black;
border-radius:8px;

box-shadow:0 0 10px #00ffe1,
           0 0 20px #00ffe1,
           0 0 40px #00ffe1;

animation:arcadePulse 1.2s ease-in-out infinite alternate;
}

@keyframes arcadePulse{
0%{box-shadow:0 0 10px #00ffe1,0 0 20px #00ffe1;}
100%{box-shadow:0 0 20px #00ffe1,0 0 40px #00ffe1,0 0 80px #00ffe1;}
}

/* CONTENIDO */

.container{
display:none;
padding:60px 20px;
max-width:1300px;
margin:auto;
}

.card{
background:rgba(0,0,0,0.75);
border:2px solid #00ffe1;
padding:40px;
margin:40px auto;
border-radius:14px;
transition:.4s;
}

.card:hover{
transform:scale(1.03);
box-shadow:0 0 40px #00ffe1;
}

/* BARRA */

.bar{
width:420px;
height:30px;
background:#111;
margin:30px auto;
border-radius:20px;
overflow:hidden;
border:2px solid #00ffe1;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ffe1,#00ff6a);
animation:load 6s forwards;
}

@keyframes load{
from{width:0}
to{width:100%}
}

.levelup{
font-size:60px;
color:#00ff6a;
text-shadow:0 0 30px #00ff6a;
animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1)}
to{transform:scale(1.15)}
}

/* CARRUSEL */

.carouselPro{
width:600px;
height:400px;
margin:40px auto;
position:relative;
overflow:hidden;
border-radius:20px;
box-shadow:0 0 40px #00ffe1;
background:black;
}

.carouselPro img{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
object-fit:contain;
background:black;
opacity:0;
transition:opacity 1.2s;
}

.carouselPro img.active{
opacity:1;
}

/* BOTONES */

.gpsBtn,.waBtn{
display:inline-block;
margin-top:20px;
background:#00ffe1;
color:black;
padding:16px 28px;
text-decoration:none;
border-radius:10px;
box-shadow:0 0 15px #00ffe1;
}

/* PAGO PRO */

.sub{color:#00ffe1;margin-top:20px;}
.importante{color:#ffd54a;}
.fecha{color:#ff4df0;}

.aliasBox{
margin:20px auto;
padding:20px;
font-size:18px;
border:2px solid #00ffe1;
border-radius:12px;
cursor:pointer;
color:#00ffe1;
text-shadow:0 0 10px #00ffe1;
animation:glow 1.5s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 10px #00ffe1;}
to{box-shadow:0 0 30px #00ffe1;}
}

.copyBtn{
margin-top:10px;
background:#00ffe1;
border:none;
padding:12px 20px;
cursor:pointer;
border-radius:8px;
}

#copiadoMsg{
opacity:0;
color:#00ff6a;
transition:0.3s;
}

</style>
</head>

<body>

<div id="flash"></div>

<div id="startScreen">
<h1>🎮 CHECHU</h1>
<div class="coin">INSERT COIN</div>
<button class="startBtn" onclick="startGame()">PRESS START</button>
</div>

<div class="container" id="main">

<h1>LEVEL COMPLETE</h1>
<h2>Nivel 39 completado</h2>

<div class="bar"><div class="fill"></div></div>
<div class="levelup">LEVEL UP 40</div>

<div class="card">
<h2>🎯 MISIÓN</h2>
<p>📅 24/04/2026</p>
<p>🕒 20:45 HS</p>
<p>📍 CLUB ESCALANTITO</p>

<iframe src="https://www.google.com/maps?q=-31.6197018,-60.7007826&output=embed" width="100%" height="400"></iframe>

<a class="gpsBtn" href="https://maps.app.goo.gl/6e7FYAde83PTVfzW7" target="_blank">
📍 ABRIR GPS
</a>
</div>

<div class="card">
<h2>📸 NIVELES SUPERADOS</h2>

<div class="carouselPro">
<img src="foto1.jpeg" class="active">
<img src="foto2.jpeg">
<img src="foto3.jpeg">
<img src="foto4.jpeg">
</div>
</div>

<div class="card">
<h2>💰 APORTES</h2>

<p class="sub">Alias</p>

<div class="aliasBox" onclick="copiarAlias()">
CHECHUCUMPLE40
</div>

<button class="copyBtn" onclick="copiarAlias()">📋 Copiar alias</button>

<p id="copiadoMsg">✔ Alias copiado</p>

<a class="waBtn"
href="https://wa.me/549342216819?text=Ya%20realicé%20la%20transferencia%20🎮"
target="_blank">
📲 Enviar comprobante
</a>

</div>

</div>

<script>

function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("main").style.display="block";
}

function copiarAlias(){
navigator.clipboard.writeText("chechucumple40");

let msg = document.getElementById("copiadoMsg");
msg.style.opacity = "1";

setTimeout(()=>{
msg.style.opacity = "0";
},1500);
}

window.addEventListener("load", () => {
let slides = document.querySelectorAll(".carouselPro img");
let i = 0;

setInterval(()=>{
slides[i].classList.remove("active");
i = (i+1)%slides.length;
slides[i].classList.add("active");
},2000);
});

</script>

</body>
</html>
