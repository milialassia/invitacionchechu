<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Level Up CHECHU</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Press Start 2P', cursive;
color:white;
text-align:center;
overflow-x:hidden;
background:black;
}

/* GRID */

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
linear-gradient(#00ffe133 1px, transparent 1px),
linear-gradient(90deg,#00ffe133 1px, transparent 1px);
background-size:60px 60px;
transform:perspective(400px) rotateX(60deg);
animation:gridMove 20s linear infinite;
z-index:-1;
}

@keyframes gridMove{
from{background-position:0 0}
to{background-position:0 60px}
}

/* START */

#startScreen{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:100;
}

.coin{
font-size:22px;
color:#ffd54a;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0}
}

.startBtn{
margin-top:30px;
background:#00ffe1;
border:none;
padding:20px 40px;
cursor:pointer;
box-shadow:0 0 25px #00ffe1;
}

/* CONTENIDO */

.container{
display:none;
padding:60px 20px;
max-width:1300px;
margin:auto;
}

.card{
background:rgba(0,0,0,0.75);
border:2px solid #00ffe1;
padding:40px;
margin:40px auto;
border-radius:14px;
transition:.4s;
}

.card:hover{
transform:scale(1.03);
box-shadow:0 0 40px #00ffe1;
}

/* BARRA */

.bar{
width:420px;
height:30px;
background:#111;
margin:30px auto;
border-radius:20px;
overflow:hidden;
border:2px solid #00ffe1;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ffe1,#00ff6a);
animation:load 6s forwards;
}

@keyframes load{
from{width:0}
to{width:100%}
}

.levelup{
font-size:60px;
color:#00ff6a;
text-shadow:0 0 30px #00ff6a;
animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1)}
to{transform:scale(1.15)}
}

/* 🎮 CARRUSEL PRO */

.carouselPro{
position:relative;
max-width:600px;
margin:auto;
overflow:hidden;
border-radius:20px;
box-shadow:0 0 40px #00ffe1;
}

.carouselPro img{
width:100%;
transition:1s;
animation:zoom 6s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.15)}
}

.glitch{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
background:linear-gradient(transparent,#ff00ff33,transparent);
mix-blend-mode:screen;
animation:glitch 2s infinite;
}

@keyframes glitch{
0%{opacity:0}
20%{opacity:.4}
40%{opacity:0}
60%{opacity:.5}
80%{opacity:0}
100%{opacity:.3}
}

.countdown{
color:#ff4df0;
font-size:20px;
margin-top:20px;
}

.gpsBtn,.waBtn{
display:inline-block;
margin-top:20px;
background:#00ffe1;
color:black;
padding:16px 28px;
text-decoration:none;
border-radius:10px;
box-shadow:0 0 15px #00ffe1;
}

.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall 3s linear infinite;
}

@keyframes fall{
to{transform:translateY(100vh)}
}

iframe{
box-shadow:0 0 30px #00ffe1;
border-radius:12px;
}

</style>
</head>

<body>

<div id="startScreen">
<h1>🎮 CHECHU</h1>
<div class="coin">INSERT COIN</div>
<button class="startBtn" onclick="startGame()">PRESS START</button>
</div>

<div class="container" id="main">

<h1>LEVEL COMPLETE</h1>
<h2>Nivel 39 completado</h2>

<div class="bar"><div class="fill"></div></div>
<div class="levelup">LEVEL UP 40</div>

<div class="countdown" id="countdown"></div>

<div class="card">
<h2>🎯 MISIÓN</h2>
<h2>Celebrar el LEVEL UP de CHECHU</h2>
<p>📅 24/04/2026</p>
<p>🕒 21:00 HS</p>
<p>📍 CLUB ESCALANTITO</p>

<iframe
src="https://www.google.com/maps?q=-31.6197018,-60.7007826&output=embed"
width="100%"
height="400">
</iframe>

<a class="gpsBtn"
href="https://maps.app.goo.gl/6e7FYAde83PTVfzW7"
target="_blank">
📍 ABRIR GPS
</a>
 
</div>

<div class="card">
<h2>📸 NIVELES SUPERADOS</h2>

<div class="carouselPro">
<img id="slide" src="foto1.jpeg">
<div class="glitch"></div>
</div>

</div>

<div class="card">
<h2>✅ CONFIRMAR ASISTENCIA</h2>

<a class="waBtn"
href="https://wa.me/549342216819?text=Voy%20al%20Level%20Up%20de%20Chechu"
target="_blank">
CONFIRMAR POR WHATSAPP
</a>

</div>

</div>

<script>

function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("main").style.display="block";
}

var images = [
"foto1.jpeg","foto2.jpeg","foto3.jpeg","foto4.jpeg","foto5.jpeg",
"foto6.jpeg","foto7.jpeg","foto8.jpeg","foto9.jpeg","foto10.jpeg",
"foto11.jpeg","foto12.jpeg","foto13.jpeg","foto14.jpeg","foto15.jpeg",
"foto16.jpeg","foto17.jpeg","foto18.jpeg","foto19.jpeg","foto20.jpeg",
"foto21.jpeg","foto22.jpeg","foto23.jpeg","foto24.jpeg","foto25.jpeg",
"foto26.jpeg","foto27.jpeg","foto28.jpeg","foto29.jpeg","foto30.jpeg"
];

var i=0;

setInterval(function(){

i++;
if(i>=images.length){i=0;}

var slide=document.getElementById("slide");

slide.style.opacity=0;

setTimeout(function(){
slide.src=images[i];
slide.style.opacity=1;
},300);

},900);

</script>

</body>
</html>
